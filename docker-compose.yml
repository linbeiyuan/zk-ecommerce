version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:5.7
    container_name: zk-mysql
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=pyzkds
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - zk-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: zk-redis
    ports:
      - "6379:6379"
    networks:
      - zk-network
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  # 后端服务
  backend:
    build: ./pyzkds
    container_name: zk-backend
    ports:
      - "8000:8000"
    volumes:
      - ./pyzkds:/app
    environment:
      - DEBUG=1
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=pyzkds
      - DB_USER=root
      - DB_PASSWORD=123456
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ENABLE_REAL_SMS=true
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - zk-network

  # 管理后台前端
  admin:
    build: ./admin/admin
    container_name: zk-admin
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - zk-network

  # 用户前台
  front:
    build: ./front/front
    container_name: zk-front
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - zk-network

networks:
  zk-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
